services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gccs
      POSTGRES_USER: gccs
      POSTGRES_PASSWORD: gccs_dev_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gccs -d gccs"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    environment:
      AZURITE_ACCOUNTS: "gccs:Z2Njcy1sb2NhbC1kZXYtc3RvcmFnZS1rZXktMDEyMzQ1Njc4OWFiY2RlZg=="
    ports:
      - "19000:10000"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000,'127.0.0.1').on('connect',function(){this.end();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav-debian:stable
    ports:
      - "13310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20

volumes:
  postgres_data:
  azurite_data:
