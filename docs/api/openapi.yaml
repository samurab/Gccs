        - contract-deliverable
        - option-period
        - evidence-request
        - other

    EvidenceStatus:
      type: string
      enum:
        - draft
        - requested
        - submitted
        - under-review
        - approved
        - rejected
        - expired
        - archived

    EvidenceType:
      type: string
      enum:
        - policy
        - training-record
        - screenshot
        - system-configuration
        - vendor-attestation
        - subcontractor-certification
        - signed-flow-down
        - payroll-record
        - wage-record
        - incident-record
        - access-review
        - risk-assessment
        - meeting-note
        - corrective-action-plan
        - other

    MalwareScanStatus:
      type: string
      enum:
        - pending
        - clean
        - infected
        - failed
        - skipped

    EvidenceReviewDecision:
      type: string
      enum:
        - approve
        - reject
        - request-changes
        - archive
        - expire

    CmmcLevel:
      type: string
      enum:
        - Level1
        - Level2
        - Level3

    ControlImplementationStatus:
      type: string
      enum:
        - NotStarted
        - Implemented
        - PartiallyImplemented
        - NotApplicable
        - NeedsReview

    SubcontractorStatus:
      type: string
      enum:
        - active
        - onboarding
        - blocked
        - inactive
        - archived

    ReportType:
      type: string
      enum:
        - compliance-status
        - contract-obligation-matrix
        - cmmc-readiness
        - prime-evidence-package
        - sam-sba-profile
        - subcontractor-compliance
        - audit-trail
        - executive-risk-dashboard
        - sprs-readiness

    ReportStatus:
      type: string
      enum:
        - Queued
        - Generating
        - Complete
        - Failed
        - Archived

    SspSectionType:
      type: string
      enum: [SystemDescription, AuthorizationBoundary, Environment, Interconnections, Users, Roles, DataTypes, CuiHandlingPosture, ControlImplementationNarratives, InheritedResponsibilities, ExternalServiceProviders, EvidenceReferences]

    SspSectionStatus:
      type: string
      enum: [Draft, InReview, Approved, Superseded, Archived]

    SspLinkedRecordType:
      type: string
      enum: [CompanyProfile, SystemBoundary, Asset, CmmcControl, ResponsibilityMatrix, Policy, PoamItem, Evidence]

    SspLinkedRecord:
      type: object
      required: [recordType, recordId, relationship]
      properties:
        recordType: { $ref: "#/components/schemas/SspLinkedRecordType" }
        recordId: { type: string, maxLength: 120 }
        relationship: { type: string, maxLength: 200 }

    SspSourceReference:
      type: object
      required: [source, sourceUrl, lastReviewedAt]
      properties:
        source: { type: string, maxLength: 200 }
        sourceUrl: { type: string, format: uri, maxLength: 1000 }
        lastReviewedAt: { type: string, format: date }

    SspSectionHistory:
      type: object
      required: [status, actorUserId, actorName, changedAt]
      properties:
        status: { $ref: "#/components/schemas/SspSectionStatus" }
        actorUserId: { type: string, format: uuid }
        actorName: { type: string }
        changedAt: { type: string, format: date-time }
        notes: { type: [string, "null"] }

    CreateSspSectionRequest:
      type: object
      required: [sectionType, title, owner, linkedRecords, sourceReferences]
      properties:
        sectionType: { $ref: "#/components/schemas/SspSectionType" }
        title: { type: string, maxLength: 200 }
        owner: { type: string, maxLength: 200 }
        linkedRecords:
          type: array
          items: { $ref: "#/components/schemas/SspLinkedRecord" }
        sourceReferences:
          type: array
          items: { $ref: "#/components/schemas/SspSourceReference" }

    UpdateSspSectionRequest:
      allOf:
        - $ref: "#/components/schemas/CreateSspSectionRequest"
        - type: object
          required: [expectedVersion]
          properties:
            expectedVersion: { type: integer, format: int64, minimum: 1 }

    SspSectionStatusRequest:
      type: object
      required: [status, actorName, expectedVersion]
      properties:
        status: { $ref: "#/components/schemas/SspSectionStatus" }
        actorName:
          type: string
          maxLength: 200
          deprecated: true
          description: Retained for compatibility; lifecycle history uses the authenticated server-side identity.
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        reviewDate: { type: [string, "null"], format: date }
        reviewer: { type: [string, "null"], maxLength: 200 }
        approvalRationale: { type: [string, "null"], maxLength: 2000 }

    SspSection:
      allOf:
        - $ref: "#/components/schemas/CreateSspSectionRequest"
        - type: object
          required: [id, tenantId, status, isRequired, version, history, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            tenantId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/SspSectionStatus" }
            reviewer: { type: [string, "null"] }
            reviewDate: { type: [string, "null"], format: date }
            approvalRationale: { type: [string, "null"] }
            isRequired: { type: boolean }
            version: { type: integer, format: int64 }
            history:
              type: array
              items: { $ref: "#/components/schemas/SspSectionHistory" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    SspNarrativeStatus:
      type: string
      enum: [Draft, Approved, Superseded, Archived]

    SspNarrativeSourceType:
      type: string
      enum: [Evidence, GeneratedPolicy, Clause, Obligation]

    SspNarrativeSourceLinkRequest:
      type: object
      required: [sourceType, recordId]
      additionalProperties: false
      properties:
        sourceType: { $ref: "#/components/schemas/SspNarrativeSourceType" }
        recordId: { type: string, minLength: 1, maxLength: 120 }

    GenerateSspNarrativeDraftRequest:
      type: object
      required: [sources]
      additionalProperties: false
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/SspNarrativeSourceLinkRequest" }
        generationMode:
          type: string
          enum: [Deterministic, AiAssisted]
          default: Deterministic
          description: AI-assisted requests fail closed unless an approved provider is configured for the deployment.

    SspNarrativeClassification:
      type: object
      required: [classification, source, isApprovedDemoContent]
      properties:
        classification: { type: string, enum: [Unclassified, Fci, Cui, SyntheticCui, Prohibited, Unknown] }
        source: { type: string, enum: [UserSelected, SystemSuggested, AdminReviewed, ImportedDemoSeed] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        reviewedByUserId: { type: [string, "null"], format: uuid }
        reviewedAt: { type: [string, "null"], format: date-time }
        reason: { type: [string, "null"], maxLength: 600 }
        isApprovedDemoContent: { type: boolean }

    EditSspNarrativeDraftRequest:
      type: object
      required: [editedText, classification, expectedVersion]
      additionalProperties: false
      properties:
        editedText: { type: string, minLength: 1, maxLength: 20000 }
        reviewerNotes: { type: [string, "null"], maxLength: 4000 }
        classification:
          allOf:
            - $ref: "#/components/schemas/SspNarrativeClassification"
          description: User-selected classification confirmation. Reviewer and trusted demo provenance fields cannot be asserted by the client.
        expectedVersion: { type: integer, format: int64, minimum: 1 }

    ApproveSspNarrativeRequest:
      type: object
      required: [reviewDate, expectedVersion]
      additionalProperties: false
      properties:
        reviewDate: { type: string, format: date }
        expectedVersion: { type: integer, format: int64, minimum: 1 }

    SspNarrativeSource:
      type: object
      required: [sourceType, recordId, label, summary, sourceUrl, fingerprint, classification]
      properties:
        sourceType: { $ref: "#/components/schemas/SspNarrativeSourceType" }
        recordId: { type: string }
        label: { type: string }
        summary: { type: string }
        sourceUrl: { type: string }
        fingerprint: { type: string, description: Server-derived source revision fingerprint used for approval-time freshness checks. }
        classification: { type: string, enum: [Unclassified, Fci, Cui, SyntheticCui, Prohibited, Unknown] }

    SspNarrative:
      type: object
      required: [id, tenantId, sectionId, generatedText, status, aiAssisted, draftOnly, version, classification, sourceRecords, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        sectionId: { type: string, format: uuid }
        generatedText: { type: string, maxLength: 20000 }
        editedText: { type: [string, "null"], maxLength: 20000 }
        approvedText: { type: [string, "null"], maxLength: 20000 }
        status: { $ref: "#/components/schemas/SspNarrativeStatus" }
        aiAssisted: { type: boolean, description: True only when an implemented provider generated the draft; deterministic generation returns false. }
        draftOnly: { type: boolean }
        reviewerNotes: { type: [string, "null"], maxLength: 4000 }
        reviewerUserId: { type: [string, "null"], format: uuid }
        reviewer: { type: [string, "null"] }
        reviewDate: { type: [string, "null"], format: date }
        version: { type: integer, format: int64, minimum: 1 }
        classification: { $ref: "#/components/schemas/SspNarrativeClassification" }
        sourceRecords: { type: array, items: { $ref: "#/components/schemas/SspNarrativeSource" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SspNarrativeComparison:
      type: object
      required: [sectionId, draftNarrativeId, proposedText, proposedSources, currentApprovedSources]
      properties:
        sectionId: { type: string, format: uuid }
        approvedNarrativeId: { type: [string, "null"], format: uuid }
        draftNarrativeId: { type: string, format: uuid }
        currentApprovedText: { type: [string, "null"] }
        proposedText: { type: string }
        currentApprovedReviewerUserId: { type: [string, "null"], format: uuid }
        currentApprovedReviewer: { type: [string, "null"] }
        currentApprovedReviewDate: { type: [string, "null"], format: date }
        proposedReviewerNotes: { type: [string, "null"] }
        proposedSources: { type: array, items: { $ref: "#/components/schemas/SspNarrativeSource" } }
        currentApprovedSources: { type: array, items: { $ref: "#/components/schemas/SspNarrativeSource" } }

    CreateSspExportPackageRequest:
      type: object
      additionalProperties: false
      required: [packageVersion, systemBoundary, reviewer, format, externalShareRequested, evidenceItemIds, poamItemIds]
      properties:
        packageVersion: { type: string, minLength: 1, maxLength: 80 }
        systemBoundary: { type: string, minLength: 1, maxLength: 4000 }
        reviewer: { type: string, minLength: 1, maxLength: 200 }
        format: { type: string, enum: [HumanReadable, MachineReadable, Both] }
        externalShareRequested:
          type: boolean
          description: Must be false during generation. External sharing requires the separate administrative approval lifecycle.
        evidenceItemIds: { type: array, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }
        poamItemIds: { type: array, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }

    SspExternalShareApprovalRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }

    SspExternalShareRequest:
      type: object
      additionalProperties: false
      required: [recipient, purpose]
      properties:
        recipient: { type: string, minLength: 1, maxLength: 320 }
        purpose: { type: string, minLength: 1, maxLength: 1000 }

    SspExportPackage:
      type: object
      required: [id, tenantId, tenantName, generatedAt, packageVersion, systemBoundary, reviewer, format, disclaimer, humanReadableReport, machineReadableMetadata, sections, includedEvidence, poamReferences, status, history]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        tenantName: { type: string }
        generatedAt: { type: string, format: date-time }
        packageVersion: { type: string }
        systemBoundary: { type: string }
        reviewer: { type: string }
        format: { type: string, enum: [HumanReadable, MachineReadable, Both] }
        disclaimer: { type: string, description: "Draft-only review language that disclaims certification, assessment determination, authorization, legal advice, and government approval or endorsement." }
        humanReadableReport: { type: string }
        machineReadableMetadata: { type: object, description: Immutable JSON metadata snapshot. }
        sections: { type: array, items: { type: object } }
        includedEvidence: { type: array, items: { type: object } }
        poamReferences: { type: array, items: { type: object } }
        status: { type: string, enum: [InternalReview, ExternalShareApproved, Shared] }
        externalShareApprovedByUserId: { type: [string, "null"], format: uuid }
        externalShareApprovedAt: { type: [string, "null"], format: date-time }
        externalShareApprovalReason: { type: [string, "null"] }
        sharedByUserId: { type: [string, "null"], format: uuid }
        sharedAt: { type: [string, "null"], format: date-time }
        sharedRecipient: { type: [string, "null"] }
        sharedPurpose: { type: [string, "null"] }
        history: { type: array, items: { type: object } }

    SourceType:
      type: string
      enum:
        - far
        - dfars
        - cfr
        - nist
        - sba
        - sam
        - dol
        - agency-guidance
        - internal-policy
        - other
