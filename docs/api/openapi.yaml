openapi: 3.1.0
info:
  title: FeDril API
  version: 0.1.0
  summary: Government Contractor Compliance SaaS API
  description: >
    API specification for the FeDril MVP. FeDril is a No-CUI compliance management
    SaaS for small U.S. government contractors. The API is tenant-scoped and
    supports company profiles, contract intake, clause obligations, evidence,
    calendar tasks, CMMC readiness, subcontractor flow-downs, reports, and
    source-backed compliance content.
  contact:
    name: FeDril Product Team
servers:
  - url: http://localhost:5062
    description: Local ASP.NET Core API
  - url: https://api.fedril.example.com
    description: Production API placeholder
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health and API metadata.
  - name: Access
    description: Current-user role and permission metadata for RBAC-driven UI states.
  - name: Compliance Overview
    description: Product overview and dashboard summary.
  - name: Tenants
    description: Tenant creation, status, and current-tenant workspace metadata.
  - name: Company Profile
    description: Tenant company registration, size, certification, and data posture.
  - name: Contracts
    description: Contract, solicitation, subcontract, and purchase order intake.
  - name: Clauses
    description: Contract clause capture and normalization.
  - name: Obligations
    description: Source-backed compliance obligations and contract obligation matrices.
  - name: Tasks
    description: Compliance calendar, reminders, and work assignment.
  - name: Evidence
    description: No-CUI acknowledgement, evidence vault metadata, upload intents, versions, and reviews.
  - name: CMMC
    description: CMMC and NIST readiness assessments, controls, and POA&M metadata. SPRS scoring is deferred from the MVP.
  - name: SSP
    description: Tenant-scoped, source-backed System Security Plan section lifecycle management.
  - name: Subcontractors
    description: Subcontractor profiles, flow-down clauses, and evidence requests.
  - name: Reports
    description: Report generation and exports.
  - name: Audit Logs
    description: Tenant audit trail.
  - name: Source Library
    description: Reviewed compliance sources and obligation library governance.
paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API is reachable, but one or more local dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/me/access:
    get:
      tags:
        - Access
      summary: Get current user roles and permissions
      operationId: getCurrentUserAccess
      description: >
        Returns role-derived permissions for the authenticated tenant context so
        clients can hide restricted actions. Server-side authorization remains
        authoritative.
      responses:
        "200":
          description: Current user access metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notification-preferences:
    get:
      tags:
        - Notifications
      summary: Get current user's notification preferences
      operationId: getNotificationPreferences
      description: >
        Returns the current user's tenant-scoped notification preferences,
        creating role-based defaults when preferences do not yet exist.
      responses:
        "200":
          description: Notification preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - Notifications
      summary: Update current user's notification preferences
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferenceUpdateRequest"
      responses:
        "200":
          description: Updated notification preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreference"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notifications:
    get:
      tags:
        - Notifications
      summary: List current user's notifications
      operationId: listNotifications
      description: >
        Returns tenant-scoped assignment and reminder notifications for the
        authenticated user, including source links that remain protected by the
        linked record's authorization policy.
      responses:
        "200":
          description: Current user's notification center items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationCenterItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Notifications
      summary: Mark notification as read
      operationId: markNotificationRead
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationCenterItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/notifications/due-date-reminders:
    post:
      tags:
        - Notifications
      summary: Run due-date reminder job
      operationId: runDueDateReminders
      description: >
        Finds upcoming and overdue open tasks for the current tenant, creates
        idempotent local notification/email placeholders, and records delivery
        failures without stopping unrelated reminders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunDueDateReminderRequest"
      responses:
        "200":
          description: Reminder job result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DueDateReminderRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/compliance/overview:
    get:
      tags:
        - Compliance Overview
      summary: Get compliance workspace overview
      operationId: getComplianceOverview
      responses:
        "200":
          description: Dashboard overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/tenants:
    post:
      tags:
        - Tenants
      summary: Create a No-CUI tenant workspace
      operationId: createTenant
      description: >
        Creates an isolated customer tenant in the MVP No-CUI posture. Tenant
        creation requires the ManageTenant permission and creates an audit event
        in the new tenant scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Created tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/tenants/{tenantId}:
    get:
      tags:
        - Tenants
      summary: Get tenant metadata in the current tenant scope
      operationId: getTenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tenants/{tenantId}/status:
    patch:
      tags:
        - Tenants
      summary: Update tenant status
      operationId: updateTenantStatus
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantStatusRequest"
      responses:
        "200":
          description: Updated tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tenant-members:
    get:
      tags:
        - Tenants
      summary: List users assigned to the current tenant
      operationId: listCurrentTenantMembers
      description: >
        Returns only memberships for the authenticated active tenant. Requires
        the ManageUsers permission.
      responses:
        "200":
          description: Current-tenant members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Tenants
      summary: Assign a user to the current tenant
      operationId: assignTenantMember
      description: >
        Adds an explicit membership between an existing or newly recorded user
        and the authenticated tenant. Duplicate user membership in the same
        tenant is rejected and successful changes are audit logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTenantMemberRequest"
      responses:
        "201":
          description: Created current-tenant membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: User already has a membership in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/tenant-members/{membershipId}/status:
    patch:
      tags:
        - Tenants
      summary: Update current-tenant membership status
      operationId: updateTenantMembershipStatus
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantMembershipStatusRequest"
      responses:
        "200":
          description: Updated current-tenant membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tenant-invitations:
    get:
      tags:
        - Tenants
      summary: List user invitations in the current tenant
      operationId: listCurrentTenantInvitations
      description: >
        Returns only invitations for the authenticated active tenant. Requires
        the ManageUsers permission.
      responses:
        "200":
          description: Current-tenant invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Tenants
      summary: Invite a user to the current tenant
      operationId: createTenantInvitation
      description: >
        Creates a pending invitation with a local notification placeholder. The
        invited role is assigned when the token is accepted. Requires the
        ManageUsers permission and writes an audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInvitationRequest"
      responses:
        "201":
          description: Created current-tenant invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A pending invitation already exists for this email in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/invitations/{token}/accept:
    post:
      tags:
        - Tenants
      summary: Accept an invitation token
      operationId: acceptTenantInvitation
      description: >
        Accepts a pending invitation token, creates an active tenant membership
        with the invited role, and writes an audit event. Expired and revoked
        invitations cannot be accepted.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTenantInvitationRequest"
      responses:
        "200":
          description: Accepted invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tenant-invitations/{invitationId}/expire:
    post:
      tags:
        - Tenants
      summary: Expire a current-tenant invitation
      operationId: expireTenantInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Expired invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/tenant-invitations/{invitationId}/revoke:
    post:
      tags:
        - Tenants
      summary: Revoke a current-tenant invitation
      operationId: revokeTenantInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeTenantInvitationRequest"
      responses:
        "200":
          description: Revoked invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/company-profile:
    get:
      tags:
        - Company Profile
      summary: Get the tenant company profile
      operationId: getCompanyProfile
      responses:
        "200":
          description: Company profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Company Profile
      summary: Create or replace the tenant company profile
      operationId: upsertCompanyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileUpsertRequest"
      responses:
        "200":
          description: Saved company profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/company-profile/sam-lookup:
    post:
      tags:
        - Company Profile
      summary: Queue a SAM.gov profile lookup
      operationId: createSamLookup
      description: >
        Creates a lookup job against an official entity data source. The MVP
        stores the request and result metadata; API keys and adapter behavior are
        implementation details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamLookupRequest"
      responses:
        "202":
          description: Lookup accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/contracts:
    get:
      tags:
        - Contracts
      summary: List contracts
      operationId: listContracts
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContractStatus"
        - name: agency
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/ContractorRole"
      responses:
        "200":
          description: Paged contracts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PagedResult"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ContractSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Contracts
      summary: Create a contract intake record
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractCreateRequest"
      responses:
        "201":
          description: Contract created.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/contracts/{contractId}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags:
        - Contracts
      summary: Get a contract
      operationId: getContract
      responses:
        "200":
          description: Contract detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Contracts
      summary: Update contract metadata
      operationId: updateContract
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ContractPatchRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ContractPatchRequest"
      responses:
        "200":
          description: Updated contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Contracts
      summary: Archive a contract
      operationId: archiveContract
      responses:
        "204":
          description: Contract archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/contracts/{contractId}/subcontracting-plan-reporting-applicabilities:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags:
        - Contracts
      summary: List current-tenant SAM.gov SPR applicability records for a contract
      operationId: listContractSubcontractingPlanReportingApplicabilities
      responses:
        "200":
          description: Source-backed SAM.gov SPR applicability records and their task status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EsrsApplicability"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Contracts
      summary: Activate a source-backed SAM.gov SPR obligation
      operationId: createContractSubcontractingPlanReportingApplicability
      description: Creates the applicability record and linked report task atomically. A source clause or documented rationale is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EsrsApplicabilityRequest"
      responses:
        "201":
          description: SAM.gov SPR applicability and linked task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsrsApplicability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/contracts/{contractId}/subcontracting-plan-reporting-applicabilities/{applicabilityId}:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - name: applicabilityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags:
        - Contracts
      summary: Update a source-backed SAM.gov SPR obligation
      operationId: updateContractSubcontractingPlanReportingApplicability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EsrsApplicabilityRequest"
      responses:
        "200":
          description: SAM.gov SPR applicability and linked task updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsrsApplicability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/contracts/{contractId}/subcontracting-plan-reporting-applicabilities/{applicabilityId}/status:
    parameters:
      - $ref: "#/components/parameters/ContractId"
      - name: applicabilityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Contracts
      summary: Update a SAM.gov SPR task status
      operationId: updateContractSubcontractingPlanReportingApplicabilityStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: "#/components/schemas/EsrsReportTaskStatus"
      responses:
        "200":
          description: SAM.gov SPR applicability and linked task status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EsrsApplicability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/subcontracting-plan-reports/schedule-templates:
    get:
      tags:
        - Contracts
      summary: List source-backed suggested ISR and SSR schedule dates
      operationId: listSubcontractingPlanReportScheduleTemplates
      description: Suggested dates require confirmation against the governing subcontracting plan and agency instructions.
      parameters:
        - name: fiscalYear
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2200
      responses:
        "200":
          description: Suggested source-backed schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EsrsScheduleTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/contracts/{contractId}/subcontracting-plan-report-data:
    parameters:
      - $ref: "#/components/parameters/ContractId"
    get:
      tags: [Reports]
      summary: List tenant-scoped subcontracting report data rows
      operationId: listContractSubcontractingPlanReportData
      responses:
        "200":
          description: Current-tenant report data rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubcontractingReportDataRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
