name: Static Web App pull request previews

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "25"
          cache: npm

      - name: Build web artifact
        run: |
          npm ci
          npm run build:web

      - name: Write preview runtime configuration
        env:
          FEDRIL_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          FEDRIL_WORKFORCE_CLIENT_ID: ${{ vars.STAGING_MSAL_CLIENT_ID }}
          FEDRIL_WORKFORCE_TENANT_ID: ${{ vars.STAGING_MSAL_TENANT_ID }}
          FEDRIL_WORKFORCE_API_SCOPE: ${{ vars.STAGING_MSAL_API_SCOPE }}
          FEDRIL_CUSTOMER_CLIENT_ID: ${{ vars.STAGING_CUSTOMER_MSAL_CLIENT_ID }}
          FEDRIL_CUSTOMER_TENANT_ID: ${{ vars.STAGING_CUSTOMER_MSAL_TENANT_ID }}
          FEDRIL_CUSTOMER_TENANT_SUBDOMAIN: ${{ vars.STAGING_CUSTOMER_MSAL_TENANT_SUBDOMAIN }}
          FEDRIL_CUSTOMER_API_SCOPE: ${{ vars.STAGING_CUSTOMER_MSAL_API_SCOPE }}
          FEDRIL_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FEDRIL_BUILD_ID: ${{ github.run_id }}
        run: |
          export FEDRIL_APP_VERSION="$(jq -r '.version' release/version.json)"
          node tools/release/write-runtime-config.mjs apps/web/dist/runtime-config.js

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_ROCK_016FF040F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (
          github.event.action == 'closed' &&
          contains(github.event.pull_request.labels.*.name, 'deploy-preview')
        ) ||
        (
          github.event.action == 'unlabeled' &&
          github.event.label.name == 'deploy-preview'
        )
      )
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_ROCK_016FF040F }}
          action: close
