name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-prerequisites:
    name: Backend prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"

      - name: Validate approved launch candidate synchronization
        run: npm run check:launch-candidate

      - name: Validate SemVer release and promotion controls
        run: |
          npm run check:release-control
          npm run test:release-control

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore Gccs.slnx

      - name: Scan backend dependencies for known vulnerabilities
        run: dotnet list Gccs.slnx package --vulnerable --include-transitive

      - name: Build backend solution
        run: dotnet build Gccs.slnx --no-restore --configuration Release

      - name: Validate EF Core migrations
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Gccs.Infrastructure/Gccs.Infrastructure.csproj \
            --startup-project apps/api/Gccs.Api.csproj \
            --context GccsDbContext
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project src/Gccs.Infrastructure/Gccs.Infrastructure.csproj \
            --startup-project apps/api/Gccs.Api.csproj \
          --context GccsDbContext \
          --output "$RUNNER_TEMP/gccs-idempotent-migrations.sql"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"

      - name: Validate Terraform environments
        run: |
          for environment in dev staging production; do
            terraform -chdir="infra/terraform/environments/$environment" init -backend=false
            terraform -chdir="infra/terraform/environments/$environment" validate
          done

      - name: Run extraction precision and recall evaluation
        run: >
          python3 tools/extraction-evaluation/evaluate_corpus.py
          --corpus tests/fixtures/extraction-corpus
          --output-dir TestResults/extraction-evaluation
          --min-precision 0.95
          --min-recall 0.95

      - name: Upload backend prerequisite results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-prerequisite-results
          path: TestResults/extraction-evaluation

  backend-tests:
    name: Backend regression (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore Gccs.slnx

      - name: Build backend solution
        run: dotnet build Gccs.slnx --no-restore --configuration Release

      - name: Create deterministic backend test shard
        run: |
          tools/ci/create-backend-test-shard-filter.sh \
            "${{ matrix.shard }}" \
            "4" \
            "$RUNNER_TEMP/backend-test-filter.txt"

      - name: Run backend unit and integration tests
        timeout-minutes: 35
        run: >
          dotnet test tests/Gccs.Api.Tests/Gccs.Api.Tests.csproj
          --no-build
          --configuration Release
          --settings tests/Gccs.Api.Tests/regression.runsettings
          --filter "$(cat "$RUNNER_TEMP/backend-test-filter.txt")"
          --logger "trx;LogFileName=gccs-backend-tests-${{ matrix.shard }}.trx"
          --results-directory "TestResults/backend/${{ matrix.shard }}"
          --blame-hang
          --blame-hang-timeout 10m
          --blame-hang-dump-type mini

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: TestResults/backend/${{ matrix.shard }}

  backend:
    name: Backend validation
    if: always()
    needs: [backend-prerequisites, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify backend validation gates
        env:
          PREREQUISITE_RESULT: ${{ needs.backend-prerequisites.result }}
          REGRESSION_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [[ "$PREREQUISITE_RESULT" != "success" || "$REGRESSION_RESULT" != "success" ]]; then
            echo "Backend prerequisites: $PREREQUISITE_RESULT"
            echo "Backend regression shards: $REGRESSION_RESULT"
            exit 1
          fi

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Restore frontend dependencies
        run: npm ci

      - name: Validate OpenAPI contract
        run: npm run lint:openapi

      - name: Scan frontend dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint frontend workspace
        run: npm run lint:web

      - name: Run frontend unit tests
        run: npm --workspace apps/web run test:run -- --reporter=default --reporter=junit --outputFile=TestResults/web/vitest-junit.xml

      - name: Build frontend workspace
        run: npm run build:web

      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-test-results
          path: apps/web/TestResults/web

  real-stack-critical-uat:
    name: Real-stack report RBAC
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a63c1ea3f6a3a5a1621f97d2aba3b30faecfab4224c1b0000cc85ced57bb1939
        env:
          POSTGRES_DB: gccs
          POSTGRES_USER: gccs
          POSTGRES_PASSWORD: gccs_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gccs -d gccs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
        env:
          AZURITE_ACCOUNTS: "gccs:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=="
        ports:
          - 10000:10000
        options: >-
          --health-cmd "node -e \"require('net').connect(10000,'127.0.0.1').on('connect',function(){this.end();process.exit(0)}).on('error',()=>process.exit(1))\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      clamav:
        image: clamav/clamav-debian:stable@sha256:d7ede3cefeaf3b8a72ebcdee849d13f504bbca3f3b3cfade5bc7b6ee06a4f62c
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --version"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      # Every test host shares this fixture DB; none may consume another test's pending cleanup.
      ObjectCleanupProcessing__Enabled: "false"
      ConnectionStrings__GccsDatabase: Host=127.0.0.1;Port=5432;Database=gccs;Username=gccs;Password=gccs_dev_password
      ConnectionStrings__AzureStorage: DefaultEndpointsProtocol=http;AccountName=gccs;AccountKey=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;BlobEndpoint=http://127.0.0.1:10000/gccs;
      GCCS_DATABASE: Host=127.0.0.1;Port=5432;Database=gccs;Username=gccs;Password=gccs_dev_password
      GCCS_TEST_POSTGRES_CONNECTION: Host=127.0.0.1;Port=5432;Database=gccs;Username=gccs;Password=gccs_dev_password
      MalwareScanning__Host: 127.0.0.1
      MalwareScanning__Port: 3310
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          cache: npm

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          npm ci
          dotnet restore Gccs.slnx
          dotnet tool restore

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/fedril-playwright-${{ github.run_id }}-${{ github.run_attempt }}-real-stack
        timeout-minutes: 10
        run: |
          if [[ -e "$PLAYWRIGHT_BROWSERS_PATH" || -L "$PLAYWRIGHT_BROWSERS_PATH" ]]; then
            echo "::error::Run-specific Playwright browser destination already exists; preserving it."
            exit 1
          fi
          mkdir -- "$PLAYWRIGHT_BROWSERS_PATH"

          mapfile -t google_chrome_sources < <(sudo grep -RIlF "dl.google.com/linux/chrome-stable" /etc/apt/sources.list.d || true)
          for google_chrome_source in "${google_chrome_sources[@]}"; do
            if [[ ! -f "$google_chrome_source" || -L "$google_chrome_source" || "$(realpath -- "$google_chrome_source")" != /etc/apt/sources.list.d/* ]]; then
              echo "::error::APT source is not a regular non-symlink beneath the approved directory."
              exit 1
            fi
            printf 'Selected APT source: %s -> %s\n' "$google_chrome_source" "${google_chrome_source}.disabled"
            if [[ -e "${google_chrome_source}.disabled" || -L "${google_chrome_source}.disabled" ]]; then
              echo "::error::APT source destination already exists; preserving source and destination."
              exit 1
            fi
          done
          for google_chrome_source in "${google_chrome_sources[@]}"; do
            sudo mv --no-clobber -- "$google_chrome_source" "${google_chrome_source}.disabled"
            if [[ -e "$google_chrome_source" || -L "$google_chrome_source" ]]; then
              echo "::error::APT source was not moved; stopping without overwriting destination."
              exit 1
            fi
          done

          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::Playwright Chromium installation failed after $attempt attempts."
              exit 1
            fi

            delay=$((attempt * 30))
            echo "::warning::Playwright Chromium installation failed on attempt $attempt; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Build API
        run: dotnet build apps/api/Gccs.Api.csproj --no-restore --configuration Release

      - name: Apply database migrations
        run: >
          dotnet tool run dotnet-ef database update
          --project src/Gccs.Infrastructure/Gccs.Infrastructure.csproj
          --startup-project apps/api/Gccs.Api.csproj
          --context GccsDbContext

      - name: Verify report, SPRS calculation, and audit transaction rollback
        run: >
          dotnet test tests/Gccs.Api.Tests/Gccs.Api.Tests.csproj
          --no-restore
          --filter "FullyQualifiedName~ReportPostgresTransactionTests|FullyQualifiedName~ContractExtractionPostgresTransactionTests|FullyQualifiedName~AiOutputPostgresTests|FullyQualifiedName~FedRampPersistenceTests|FullyQualifiedName~LaborApplicabilityWageDeterminationTests|FullyQualifiedName~LaborApplicabilityRealStackTests"

      - name: Run real-stack report authorization tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/fedril-playwright-${{ github.run_id }}-${{ github.run_attempt }}-real-stack
        run: npm run test:e2e:real

      - name: Upload real-stack browser artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-stack-critical-uat
          path: output/playwright

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test repository artifact policy
        run: node --test tools/security/check-sensitive-artifacts.test.mjs

      - name: Reject introduced database artifacts
        env:
          SENSITIVE_ARTIFACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/security/check-sensitive-artifacts.mjs --changed-since "$SENSITIVE_ARTIFACT_BASE_SHA"

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
