name: Approved release attestation

on:
  push:
    branches: ["main"]
    paths:
      - docs/release/approved-release.json
      - tools/release/release-control.mjs
      - .github/workflows/approved-release-attestation.yml

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-approved-release:
    name: Attest approved release manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"

      - name: Determine manifest status
        id: manifest
        run: |
          npm run check:release-control
          status="$(jq -r '.status' docs/release/approved-release.json)"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Validate production-approved manifest
        if: steps.manifest.outputs.status == 'approved'
        run: |
          release_tag="$(jq -r '.releaseTag' docs/release/approved-release.json)"
          node tools/release/release-control.mjs production docs/release/approved-release.json "$release_tag"

      - name: Attest approved manifest
        if: steps.manifest.outputs.status == 'approved'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: docs/release/approved-release.json

      - name: Preserve legacy import as unsigned rollback evidence
        if: steps.manifest.outputs.status == 'legacy-import'
        run: echo "Legacy import is rollback evidence only; immutable production promotion remains disabled."
